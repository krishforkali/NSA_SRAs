<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where the water went</title>
<meta name="description" content="The July 2026 flood in Upper Assam, seen by NASA–ISRO NISAR radar, on an interactive 3D globe.">
<meta name="theme-color" content="#050a16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23256abf'/%3E%3Cpath d='M4 20c4-4 8 4 12 0s8 4 12 0' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/globe.css">
</head>
<body class="screen-globe">

<div id="map" aria-label="3D map"></div>

<!-- header: title (left), language + learn more (right) -->
<header class="g-head">
  <div class="g-titles">
    <h1 data-i18n="g.title"></h1>
    <p data-i18n="g.sub"></p>
    <!-- data credits. Official logos are trademarks: drop permitted files into assets/logos/
         (nasa.png, isro.png, nisar.png) and they replace the text marks automatically. -->
    <div class="credits" aria-label="Data from">
      <span class="cr-l" data-i18n="g.datafrom"></span>
      <span class="mark"><img src="assets/logos/nasa.png" alt="NASA" onerror="this.remove()"><b>NASA</b></span>
      <span class="mark"><img src="assets/logos/isro.png" alt="ISRO" onerror="this.remove()"><b>ISRO</b></span>
      <span class="mark nisar"><img src="assets/logos/nisar.png" alt="NISAR" onerror="this.remove()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M5 12a7 7 0 0 1 7-7M2 12A10 10 0 0 1 12 2M19 12a7 7 0 0 1-7 7M22 12a10 10 0 0 1-10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><b>NISAR</b></span>
      <span class="mark"><b>ASF DAAC</b></span>
    </div>
  </div>
  <div class="g-right">
    <a class="g-btn ghost small" href="index.html" data-i18n="g.learn"></a>
    <div class="g-lang" role="group" data-i18n-aria="lang.label">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
    </div>
  </div>
</header>

<!-- screen 1 -->
<div class="g-start" id="start">
  <div class="g-start-btns">
    <button class="g-btn big" id="fly" data-i18n="g.fly"></button>
    <button class="g-btn ghost big" id="watch-globe" data-i18n="g.watch"></button>
  </div>
  <p class="g-auto" id="auto" aria-live="polite"></p>
</div>

<!-- screen 2 -->
<p class="g-hint" id="hint" data-i18n="g.hint" hidden></p>

<!-- explore mode -->
<button class="g-btn ghost back" id="back" data-i18n="g.back" hidden></button>
<button class="g-btn ghost ex-toggle" id="ex-toggle" aria-expanded="false" aria-controls="explore" data-i18n="g.ex.toggle" hidden></button>
<section class="g-box explore" id="explore" aria-labelledby="ex-title" hidden>
  <h2 id="ex-title" data-i18n="g.ex.title"></h2>
  <div class="g-dates" id="ex-dates" role="group"></div>
  <div class="g-checks" id="ex-layers"></div>
  <label class="g-range"><span data-i18n="g.opacity"></span>
    <input type="range" id="ex-opacity" min="0.2" max="1" step="0.05" value="0.85"></label>
  <p class="g-small" data-i18n="g.tapany"></p>
</section>

<!-- legend: compact; rows appear only for layers that are on the map -->
<div class="g-box legend" id="legend" data-i18n-aria="g.legend" hidden>
  <span class="lg" data-k="water"><span class="sw water"></span><span data-i18n="legend.water"></span></span>
  <span class="lg" data-k="classes"><span class="sw permanent"></span><span data-i18n="cls.permanent"></span></span>
  <span class="lg" data-k="classes"><span class="sw flooded_receded"></span><span data-i18n="cls.flooded_receded"></span></span>
  <span class="lg" data-k="classes"><span class="sw flooded_persisting"></span><span data-i18n="cls.flooded_persisting"></span></span>
  <span class="lg" data-k="classes"><span class="sw flooded_vegetation"></span><span data-i18n="cls.flooded_vegetation"></span></span>
  <span class="lg" data-k="radar"><span class="ramp"></span><span data-i18n="g.legend.radar"></span></span>
</div>

<!-- screen 3: panel (side panel on desktop, bottom sheet on mobile) -->
<aside class="g-panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
  <div class="p-head">
    <h2 id="panel-title" tabindex="-1" data-i18n="g.panel"></h2>
    <button class="p-close" id="close" data-i18n-aria="g.close">×</button>
  </div>
  <div class="p-tabs" role="tablist">
    <button role="tab" id="t-story" aria-controls="s-story" aria-selected="true" data-i18n="g.tab.story"></button>
    <button role="tab" id="t-clouds" aria-controls="s-clouds" aria-selected="false" tabindex="-1" data-i18n="g.tab.clouds"></button>
    <button role="tab" id="t-numbers" aria-controls="s-numbers" aria-selected="false" tabindex="-1" data-i18n="g.tab.numbers"></button>
  </div>
  <div class="p-body">
    <section role="tabpanel" id="s-story" aria-labelledby="t-story">
      <div class="g-dates" id="p-dates" role="group"></div>
      <button class="g-btn" id="play" aria-pressed="false"></button>
      <p class="p-date" id="p-date" aria-live="polite"></p>
      <p class="p-text" id="p-text"></p>
      <p class="g-small" data-i18n="g.onmap"></p>
    </section>
    <section role="tabpanel" id="s-clouds" aria-labelledby="t-clouds" hidden>
      <p id="clouds-p"></p>
      <div class="swipe" id="swipe">
        <img class="swipe-base" src="data/backscatter_peak.png" alt="">
        <img class="swipe-top" id="swipe-opt" src="data/optical_peak.jpg" alt="">
        <span class="swipe-tag l" data-i18n="clouds.left"></span>
        <span class="swipe-note" data-i18n="g.clouds.only"></span>
        <span class="swipe-tag r" data-i18n="clouds.right"></span>
        <div class="swipe-line" aria-hidden="true"><span class="swipe-knob">◀ ▶</span></div>
        <input type="range" id="swipe-range" min="0" max="100" value="50" step="0.5" data-i18n-aria="clouds.aria">
      </div>
      <p class="g-small" id="clouds-cap"></p>
    </section>
    <section role="tabpanel" id="s-numbers" aria-labelledby="t-numbers" hidden>
      <div class="stats" id="stats"></div>
      <p class="g-small" data-i18n="g.n.range"></p>
    </section>
  </div>
  <div class="p-foot">
    <button class="g-btn ghost" id="watch" data-i18n="g.watch"></button>
    <button class="g-btn" id="to-explore" data-i18n="g.explore"></button>
    <p class="g-small soon" id="soon" aria-live="polite"></p>
  </div>
</aside>

<!-- guided tour: subtitles + controls; each part waits for its narration clip to finish -->
<!-- tour extras (rain chart, big number, 3-picture card, end card): floating card on the left -->
<aside class="tour-card" id="tour-card" aria-live="polite" hidden></aside>

<!-- tour: slim subtitle bar (max 2 lines) + one small control row; the middle of the map stays clear -->
<section class="tour" id="tour" data-i18n-aria="tour.label" hidden>
  <p class="tour-msg" id="tour-msg" aria-live="assertive"></p>
  <div class="tour-sub">
    <div class="tour-prog" id="tour-prog" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="tour-fill"></span></div>
    <p class="tour-text" id="tour-text" aria-live="polite"></p>
  </div>
  <div class="tour-ctrl">
    <span class="tour-count" id="tour-count"></span>
    <a class="tour-src" id="tour-src" href="index.html#news-sources" target="_blank" rel="noopener" data-i18n="tour.src" hidden></a>
    <span class="tour-gap"></span>
    <button class="t-btn" id="tour-back"></button>
    <button class="t-btn primary" id="tour-play"></button>
    <button class="t-btn" id="tour-next"></button>
    <button class="t-btn" id="tour-replay"></button>
    <button class="t-btn" id="tour-lang"></button>
    <button class="t-btn icon" id="tour-mute" aria-pressed="false"></button>
    <button class="t-btn icon" id="tour-close" data-i18n-aria="tour.close">×</button>
  </div>
</section>

<!-- small flood helper chat (answers from the site's own data; no server) -->
<button class="chat-launch" id="chat-launch" aria-expanded="false" aria-controls="chat">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="10.5" r="1.2" fill="currentColor"/><circle cx="12" cy="10.5" r="1.2" fill="currentColor"/><circle cx="15" cy="10.5" r="1.2" fill="currentColor"/></svg>
  <span id="chat-launch-t"></span>
</button>
<section class="chat" id="chat" role="dialog" aria-labelledby="chat-title" hidden>
  <header class="chat-head">
    <span class="chat-dot" aria-hidden="true"></span>
    <h2 id="chat-title"></h2>
    <button class="chat-x" id="chat-close">×</button>
  </header>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <div class="chat-chips" id="chat-chips"></div>
  <form class="chat-form" id="chat-form" autocomplete="off">
    <input id="chat-input" type="text" maxlength="200">
    <button id="chat-send" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l18-8L3 4l2 8-2 8zM5 12h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
  </form>
</section>

<div class="g-loading" id="loading" role="status" aria-live="polite"><span class="spin" aria-hidden="true"></span><span data-i18n="g.loading"></span></div>
<div class="g-fatal" id="fatal" hidden></div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script>window.maplibregl || document.write('<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"><\/script><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">')</script>
<script src="data/site_data.js"></script>
<script src="data/status_grid.js"></script>
<script src="data/globe_layers.js"></script>
<script src="data/db_grids.js"></script>
<script src="data/optical.js"></script>
<script src="data/rainfall.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-globe.js"></script>
<script src="js/report-tools.js"></script>
<script src="js/globe.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
